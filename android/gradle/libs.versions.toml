[versions]
# Build tools — exact pins from 01_TECH_STACK.md
kotlin = "2.4.21"
agp = "9.4.0"

# Android SDK
compileSdk = "36"
targetSdk = "36"
minSdk = "29"

# AndroidX / Compose
activityCompose = "1.13.0"
composeUi = "1.12.1"
composeFoundation = "1.12.1"
composeAnimation = "1.12.1"
composeRuntime = "1.12.1"
composeMaterial3 = "1.4.0"
composeIconsExtended = "1.7.8"
coreKtx = "1.18.0"
lifecycleRuntime = "2.11.0"
datastore = "1.2.1"

# Networking / serialization
coroutines = "1.11.0"
kotlinxSerializationJson = "1.11.0"
okhttp = "5.3.0"

# Shizuku
shizuku = "12.2.0"

# QR
zxing = "3.5.4"

[libraries]
activity-compose           = { module = "androidx.activity:activity-compose",                    version.ref = "activityCompose" }
compose-ui                 = { module = "androidx.compose.ui:ui",                                version.ref = "composeUi" }
compose-foundation         = { module = "androidx.compose.foundation:foundation",                version.ref = "composeFoundation" }
compose-animation          = { module = "androidx.compose.animation:animation",                  version.ref = "composeAnimation" }
compose-runtime            = { module = "androidx.compose.runtime:runtime",                      version.ref = "composeRuntime" }
compose-material3          = { module = "androidx.compose.material3:material3",                  version.ref = "composeMaterial3" }
compose-icons-extended     = { module = "androidx.compose.material:material-icons-extended",      version.ref = "composeIconsExtended" }
core-ktx                   = { module = "androidx.core:core-ktx",                               version.ref = "coreKtx" }
lifecycle-runtime-compose  = { module = "androidx.lifecycle:lifecycle-runtime-compose",          version.ref = "lifecycleRuntime" }
datastore-preferences      = { module = "androidx.datastore:datastore-preferences",              version.ref = "datastore" }
coroutines-android         = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android",     version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json",    version.ref = "kotlinxSerializationJson" }
okhttp                     = { module = "com.squareup.okhttp3:okhttp",                          version.ref = "okhttp" }
shizuku-api                = { module = "dev.rikka.shizuku:api",                                version.ref = "shizuku" }
shizuku-provider           = { module = "dev.rikka.shizuku:provider",                           version.ref = "shizuku" }
zxing-core                 = { module = "com.google.zxing:core",                                version.ref = "zxing" }

[plugins]
android-application  = { id = "com.android.application",                       version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android",                  version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",           version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization",     version.ref = "kotlin" }
